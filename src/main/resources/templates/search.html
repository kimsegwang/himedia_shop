<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- jQuery 추가 -->
  <link th:href="@{/css/category.css}" rel="stylesheet">

  <script th:src="@{/js/connectionpage.js}"></script>
  <script th:src="@{/js/search.js}"></script>
<!--  <script th:src="@{/js/category.js}"></script> &lt;!&ndash; JavaScript 파일 연결 &ndash;&gt;-->
  <title>검색 페이지</title>
</head>
<body>
<div class="container">
  <!-- Header -->
  <header>
    <div class="menu-logo-container">
      <button class="menu-btn" id="menuBtn">☰</button> <!-- 삼선 버튼 -->
      <h1>
        <a href="/"style="font-family: 'Tangerine', serif;text-decoration-line : none;color: black;"><i>Trend & Weather</i></a>
      </h1>
    </div>
    <div class="login-actions">
      <!-- 로그인 상태 확인 (로그인 사용자일 때만 표시) -->
      <span th:if="${session.userId != null}">
                <a th:href="@{/member/mypage}">마이페이지</a>
    <a th:href="@{/logout}">로그아웃</a>
</span>
      <span th:if="${session.userId == null}">
    <a th:href="@{/member/login}">로그인</a>
    <a th:href="@{/member/join}">회원가입</a>
</span>
    </div>
  </header>

  <!-- 카테고리 섹션 -->
  <section class="filter-section">
    <label for="sortSelect" class="filter-label">정렬 기준</label>
    <select id="sortSelect" class="filter-select">
      <option value="newest">최신순</option>
      <option value="priceLowHigh">가격 낮은순</option>
      <option value="priceHighLow">가격 높은순</option>
    </select>
  </section>
  <section class="category-section">
    <h2 id="search-text" th:text="${searchKeyword}"></h2>
  </section>

  <!-- 상품 이미지 섹션 -->

  <section class="product-grid" id="search-result-container">
    <div th:each="product : ${products}" class="product-item">
      <a th:href="@{/product/detail/{productId}(productId=${product.id})}" style="text-decoration: none; color: inherit;">

      <img th:src="@{${product.contentImg}}" alt="Product Image">
        <h3 th:text="${product.title}"></h3>
        <h4 th:text="${product.created}"></h4>
        <p th:text="${product.price} + '원'"></p>
      </a>
    </div>
  </section>

  <!-- Footer -->
  <footer>
      <p>&copy; 2024 SEG. All rights reserved.</p>
  </footer>
</div>

<!-- 사이드바 -->
<div class="wrapper">
  <div id="mySidenav" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>

    <!-- 검색 기능 추가 -->
    <div class="search-container">
      <input id ="searchInput" type="text" placeholder="검색...">
      <button>검색</button>
    </div>

    <!-- 카테고리 항목 -->
    <div class="dropdown">
      <a href="javascript:void(0)" class="dropdown-btn">TOP</a>
      <ul class="dropdown-content">
        <li><a th:href="@{/category/TOP/T-shirts}">T-Shirts</a></li>
        <li><a th:href="@{/category/TOP/Shirts}">Shirts</a></li>
        <li><a th:href="@{/category/TOP/Sweaters}">Sweaters</a></li>
      </ul>
    </div>

    <div class="dropdown">
      <a href="javascript:void(0)" class="dropdown-btn">OUTER</a>
      <ul class="dropdown-content">
        <li><a th:href="@{/category/OUTER/Coats}">Coats</a></li>
        <li><a th:href="@{/category/OUTER/Jackets}">Jackets</a></li>
        <li><a th:href="@{/category/OUTER/Hoodies}">Hoodies</a></li>
      </ul>
    </div>

    <div class="dropdown">
      <a href="javascript:void(0)" class="dropdown-btn">BOTTOM</a>
      <ul class="dropdown-content">
        <li><a th:href="@{/category/BOTTOM/Jeans}">Jeans</a></li>
        <li><a th:href="@{/category/BOTTOM/Slacks}">Slacks</a></li>
        <li><a th:href="@{/category/BOTTOM/Shorts}">Shorts</a></li>
      </ul>
    </div>

    <div class="dropdown">
      <a href="javascript:void(0)" class="dropdown-btn">ACC</a>
      <ul class="dropdown-content">
        <li><a th:href="@{/category/ACC/Bags}">Bags</a></li>
        <li><a th:href="@{/category/ACC/Hats}">Hats</a></li>
        <li><a th:href="@{/category/ACC/Scarves}">Scarves</a></li>
      </ul>
    </div>
  </div>

</div>
</body>
</html>
