<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운영자 페이지</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>

    <script th:src="@{/js/admin/admin.js}"></script>
    <script th:src="@{/js/admin/review.js}"></script>
    <script th:src="@{/js/admin/payment.js}"></script>
    <script th:src="@{/js/admin/SalesAmountGraph.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link th:href="@{/css/admin/admin.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
</head>
<body>
<h1>
    <a class="logos" href="/"><i>Trend & Weather</i></a>
</h1>
<div class="container">
    <header>
        <h1>운영자 페이지</h1>
        <nav>
            <ul>
                <li><a href="#product-registration">제품 등록</a></li>
                <li><a href="#sales-graph">판매 수치 그래프</a></li>

                <li><a href="#review-management">리뷰 관리</a></li>
                <li><a href="#user-management">회원 관리</a></li>
                <li><a href="#revenue-stats">수익 수치</a></li>
                <li><a href="#payment-section">유저 잔액 기능</a></li>
            </ul>
        </nav>
    </header>

    <section id="product-registration">
        <form action="/logout" method="post" style="display:inline;">
            <button type="submit">Logout</button>
        </form>
        <h2>제품 등록</h2>
        <form id="writeForm" enctype="multipart/form-data" method="POST">
            <label for="product-category">카테고리:</label>
            <select id="product-category" name="productCategory" required>
                <option value="">선택하세요</option>
                <option value="TOP">상의</option>
                <option value="BOTTOM">하의</option>
                <option value="OUTER">아우터</option>
                <option value="ACC">액세서리</option>
            </select>

            <div id="sub-category-container" style="display:none;">
                <h3>하위 항목 선택:</h3>
                <div id="sub-category-options"></div>
            </div>


            <label for="product-name">제품 이름:</label>
            <input type="text" id="product-name" name="productName" required>

            <label for="product-content">제품 정보:</label>
            <input type="text" id="product-content" name="productContent" required>

            <label for="product-price">가격:</label>
            <input type="number" id="product-price" name="productPrice" required>

            <label for="product-userId">유저 id:</label>
            <input type="text" id="product-userId" name="productUserId" required>

            <label for="product-temperature">기온:</label>
            <input type="number" id="product-temperature" name="productTemperature" min="1" max="5" step="1" required>

            <label for="product-precipitation">강수:</label>
            <input type="number" id="product-precipitation" name="productPrecipitation" min="0" max="1" step="1" required>

            <label for="product-stock">재고:</label>
            <input type="number" id="product-stock" name="productStock" required>

            <label for="product-image">제품 이미지:</label>
            <input type="file" id="product-image" name="productImage" accept="image/*" required>

            <button id="submitBtn" type="submit">등록하기</button>
        </form>
    </section>


    <section id="sales-graph">
        <h2>판매 수치 그래프</h2>
        <canvas id="salesChart" width="400" height="200"></canvas>
    </section>


    <section id="review-management">
        <h2>리뷰 관리</h2>
        <div class="review-list">
            <p>리뷰 목록을 보여주는 영역</p>
            <button id="fetch-review-counts">리뷰 개수 가져오기</button>

            <div id="product-review-list-container">
                <!-- 리뷰 있는 제품 목록을 표시할 div -->
            </div>

            <div id="review-list">
                <!-- 선택된 제품의 리뷰 목록을 표시할 div -->
            </div>

            <div class="pagination-controls">
                <button id="prev-page">이전 페이지</button>
                <button id="next-page">다음 페이지</button>
            </div>

            <div id="current-page-indicator">
                <p>현재 페이지: <span id="current-page">1</span></p>
            </div>
        </div>
    </section>


    <section id="user-management">
        <h2>회원 관리</h2>
        <div class="user-list">
            <table>
                <thead>
                <tr>
                    <th>유저 ID</th>
                    <th>이름</th>
                    <th>ID</th>
                    <th>PW</th>
                    <th>지역</th>
                    <th>번호</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.userId}"></td>
                    <td th:text="${member.name}"></td>
                    <td th:text="${member.id}"></td>
                    <td th:text="${member.password}"></td>
                    <td th:text="${member.myLocation}"></td>
                    <td th:text="${member.phone}"></td>
                </tr>
                </tbody>
            </table>
        </div>

    </section>

    <section id="revenue-stats">
        <h2>수익 수치</h2>
        <button id="revenue-counts">수익 수치 가져오기</button>
        <p>총 수익: <span id="total-revenue">0</span> 원</p>
        <p>총 입금: <span id="total-deposit">0</span> 원</p>
        <p>총 출금: <span id="total-withdrawal">0</span> 원</p>
    </section>

    <section id="balance-function">
        <h2>유저 잔액</h2>
        <button id="fetch-balance">잔액 가져오기</button>
        <div id="user-balance-list"></div>
    </section>
    <section id="payment-section">
        <h2>입금 및 출금</h2>

        <h3>사용자 목록</h3>
        <ul id="user-list"></ul> <!-- 사용자 ID 리스트 -->

        <label for="user-id">선택한 사용자 ID:</label>
        <input type="text" id="user-id" disabled><br>

        <label for="deposit">입금 금액:</label>
        <input type="number" id="deposit" value="0"><br>

        <label for="withdrawal">출금 금액:</label>
        <input type="number" id="withdrawal" value="0"><br>

        <button id="submit-payment">결제 추가</button>
    </section>
    <footer>
        <p>&copy; 2024 운영자 페이지</p>
    </footer>
</div>
</body>
</html>
