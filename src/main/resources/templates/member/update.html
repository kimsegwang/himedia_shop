<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>My Info</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script type="text/javascript">
    $(document).ready(function() {
      // 아이디 중복 체크
      $('#userId').blur(function() {
        var userId = $(this).val();
        $.ajax({
          type: 'POST',
          url: '/checkUserId',
          data: { userId: userId },
          success: function(response) {
            if (!response) {
              $('#userIdMessage').text('This ID is already taken.');
            } else {
              $('#userIdMessage').text('');
            }
          }
        });
      });
    });
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #4CAF50;
      font-size: 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 10px 0 5px;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      margin: 5px 0 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 14px;
    }

    #userIdMessage,
    .error-message {
      font-size: 12px;
      color: red;
      margin-bottom: 10px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      border: none;
      border-radius: 5px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }

    button[type="submit"]:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
<div class="form-container">
  <h2>My Info</h2>
  <form action="/update" method="post">
    <label for="userId">User ID:</label>
    <input type="text" id="userId" name="userId" th:value="${member.userId}" required />
    <span id="userIdMessage"></span>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" />

    <label for="myLocation">Location:</label>
    <input type="text" id="myLocation" name="myLocation" th:value="${member.myLocation}" required />

    <label for="phone">Phone:</label>
    <input type="text" id="phone" name="phone" th:value="${member.phone}" required />

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" th:value="${member.name}" required />

    <label for="currentPassword">Confirm Current Password:</label>
    <input type="password" id="currentPassword" name="currentPassword" required />

    <span th:text="${errorMessage}" class="error-message"></span>

    <button type="submit">Update Info</button>
  </form>
</div>
</body>
</html>
