<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/member/signUp.js}"></script>
    <link th:href="@{/css/member/sign.css}" rel="stylesheet">
    <title>회원가입</title>
    <script th:src="@{/js/connectionpage.js}"></script>
    <link th:href="@{/css/connectionpage.css}" rel="stylesheet">
    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tangerine">
</head>
<body>
<button style="    width: 50px;" id="menuBtn" class="openbtn" onclick="toggleNav()">&#9776;</button>

<!-- Site Header -->
<a href="/" style="font-family: 'Tangerine', serif; text-decoration-line: none; color: black; margin-left: 80px; position: fixed;">
    <h1><i>Trend & Weather</i></h1>
</a>
<div style="width: 600px;" class="container">
    <h2>회원가입</h2>
    <form id="loginForm">
        <label for="user_id">아이디:</label>
        <input type="text" id="user_id" name="user_id" required>

        <label for="password">비밀번호:</label>
        <input type="password" id="password" name="password" required>

        <label for="phoneNumber">전화번호:</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" required>

        <label for="location">주소:</label>
        <input type="text" id="location" name="location" required>

        <label for="user-name">이름 :</label>
        <input type="text" id="user-name" name="user-name" required>

        <input id="signup" type="button" value="회원가입">
    </form>
    <p>이미 계정이 있으신가요? <a href="/member/login">로그인하기</a></p>
</div>
<!-- Side Navigation -->
<div id="mySidenav" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>

    <!-- Search Bar -->
    <div class="search-container">
        <input id="searchInput" type="text" placeholder="검색...">
        <button>검색</button>
    </div>

    <!-- Category Links -->
    <div class="dropdown">
        <a href="javascript:void(0)" class="dropdown-btn">TOP</a>
        <ul class="dropdown-content">
            <li><a th:href="@{/category/TOP/T-shirts}">T-Shirts</a></li>
            <li><a th:href="@{/category/TOP/Shirts}">Shirts</a></li>
            <li><a th:href="@{/category/TOP/Sweaters}">Sweaters</a></li>
        </ul>
    </div>

    <div class="dropdown">
        <a href="javascript:void(0)" class="dropdown-btn">OUTER</a>
        <ul class="dropdown-content">
            <li><a th:href="@{/category/OUTER/Coats}">Coats</a></li>
            <li><a th:href="@{/category/OUTER/Jackets}">Jackets</a></li>
            <li><a th:href="@{/category/OUTER/Hoodies}">Hoodies</a></li>
        </ul>
    </div>

    <div class="dropdown">
        <a href="javascript:void(0)" class="dropdown-btn">BOTTOM</a>
        <ul class="dropdown-content">
            <li><a th:href="@{/category/BOTTOM/Jeans}">Jeans</a></li>
            <li><a th:href="@{/category/BOTTOM/Slacks}">Slacks</a></li>
            <li><a th:href="@{/category/BOTTOM/Shorts}">Shorts</a></li>
        </ul>
    </div>

    <div class="dropdown">
        <a href="javascript:void(0)" class="dropdown-btn">ACC</a>
        <ul class="dropdown-content">
            <li><a th:href="@{/category/ACC/Bags}">Bags</a></li>
            <li><a th:href="@{/category/ACC/Hats}">Hats</a></li>
            <li><a th:href="@{/category/ACC/Scarves}">Scarves</a></li>
        </ul>
    </div>
</div>
</body>
</html>
